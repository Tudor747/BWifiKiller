[env:esp32dev]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino

# Communication and upload speed
monitor_speed = 115200
upload_speed = 921600 

# Build configuration
upload_resetmethod = nodemcu
board_build.flash_mode = qio
board_build.partitions = huge_app.csv

# Improved build flags
build_flags = 
    -I include
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_LOOP_STACK_SIZE=16384 ; Set the Arduino loop stack without redefining SDK configuration

# Library dependencies
lib_deps =
    nrf24/RF24 @ ^1.4.7
    olikraus/U8g2 @ ^2.35.9
    marian-craciunescu/ESP32Ping @ ^1.7
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    t-vk/ESP32 BLE Keyboard @ ^0.3.2

build_src_filter =
    +<*>
    -<main_ble.cpp>
    -<pi_companion.cpp>

[env:pi_companion]
lib_deps =
    nrf24/RF24 @ ^1.4.7
    olikraus/U8g2 @ ^2.35.9
    t-vk/ESP32 BLE Keyboard @ ^0.3.2
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags}
    -D PI_COMPANION=1
build_src_filter =
    -<*>
    +<pi_companion.cpp>
    +<input_manager.cpp>
    +<app_lifecycle.cpp>
    +<ui_theme.cpp>
    +<wifi_radar.cpp>
    +<wifi_channel_scan.cpp>
    +<spectrograph.cpp>
    +<rf_heatmap.cpp>
    +<channel_advisor.cpp>
    +<coex_view.cpp>
    +<dual_nrf_scope.cpp>
    +<nrf_link.cpp>
    +<nrf_chat.cpp>
    +<btscan.cpp>
    +<bt_analyzer.cpp>
    +<bt_spectrum.cpp>
    +<packet_monitor.cpp>
    +<centinela.cpp>
    +<games_menu.cpp>
    +<snake_game.cpp>
    +<pong_game.cpp>
    +<flappy_game.cpp>
    +<space_game.cpp>
    +<dino_game.cpp>
    +<about_info.cpp>
